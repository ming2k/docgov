name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "CLI tag to release (e.g. v0.0.1)"
        required: false
        default: "v0.0.1"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          # Package dog binary
          cp "target/${{ matrix.target }}/release/dog" dist/
          # Package docgov binary alias
          cp "target/${{ matrix.target }}/release/docgov" dist/
          cd dist
          tar -czf "../dog-${{ matrix.target }}.tar.gz" dog docgov
          # Backwards compatibility bundle name
          tar -czf "../docgov-${{ matrix.target }}.tar.gz" dog docgov
          cd ..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dog-${{ matrix.target }}.tar.gz" > "dog-${{ matrix.target }}.tar.gz.sha256"
            sha256sum "docgov-${{ matrix.target }}.tar.gz" > "docgov-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "dog-${{ matrix.target }}.tar.gz" > "dog-${{ matrix.target }}.tar.gz.sha256"
            shasum -a 256 "docgov-${{ matrix.target }}.tar.gz" > "docgov-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/dog.exe" -Destination dist/
          Copy-Item "target/${{ matrix.target }}/release/docgov.exe" -Destination dist/
          Compress-Archive -Path "dist/*" -DestinationPath "dog-${{ matrix.target }}.zip" -Force
          Copy-Item "dog-${{ matrix.target }}.zip" -Destination "docgov-${{ matrix.target }}.zip"
          $hashDog = (Get-FileHash -Algorithm SHA256 "dog-${{ matrix.target }}.zip").Hash.ToLower()
          "$hashDog  dog-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dog-${{ matrix.target }}.zip.sha256"
          $hashDocgov = (Get-FileHash -Algorithm SHA256 "docgov-${{ matrix.target }}.zip").Hash.ToLower()
          "$hashDocgov  docgov-${{ matrix.target }}.zip" | Out-File -Encoding ascii "docgov-${{ matrix.target }}.zip.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dog-${{ matrix.target }}.*
            docgov-${{ matrix.target }}.*

  create-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        if: env.CRATES_IO_TOKEN != ''
        run: cargo publish --manifest-path cli/Cargo.toml --token "${{ secrets.CRATES_IO_TOKEN }}"
